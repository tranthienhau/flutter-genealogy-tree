name: flutter_genealogy_tree
description: Flutter family tree / genealogy POC with CSV / XLS / GEDCOM import, offline-first storage, and share-with-relatives invites.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^8.1.2
  uuid: ^4.5.0
  supabase_flutter: ^2.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
